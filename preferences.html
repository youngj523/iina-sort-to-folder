<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <style>
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .row label {
        flex: 0 0 72px;
      }
      .row input[type="text"] {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div class="pref-section">
      <h3>資料夾 1</h3>
      <div class="row">
        <label for="dir1">位置</label>
        <input id="dir1" type="text" data-pref-key="dir1" placeholder="例如 ~/Movies/保留" />
      </div>
      <div class="row">
        <label for="label1">按鈕文字</label>
        <input id="label1" type="text" data-pref-key="label1" placeholder="留空則顯示資料夾名稱" />
      </div>
    </div>

    <div class="pref-section">
      <h3>資料夾 2</h3>
      <div class="row">
        <label for="dir2">位置</label>
        <input id="dir2" type="text" data-pref-key="dir2" placeholder="例如 ~/Movies/之後再看" />
      </div>
      <div class="row">
        <label for="label2">按鈕文字</label>
        <input id="label2" type="text" data-pref-key="label2" placeholder="留空則顯示資料夾名稱" />
      </div>
    </div>

    <div class="pref-section">
      <div class="row">
        <input id="showButtons" type="checkbox" data-type="bool" data-pref-key="showButtons" />
        <label for="showButtons" style="flex: 1">在播放畫面上顯示按鈕</label>
      </div>
    </div>

    <p class="pref-help">
      位置請填完整路徑（以 <code>/</code> 或 <code>~/</code> 開頭），資料夾必須已經存在。<br />
      不想手動輸入的話，播放影片時到選單列的「外掛」選擇「設定資料夾 1…／2…」，就能用視窗點選資料夾。<br />
      快速鍵：Ctrl+1、Ctrl+2 移動到對應資料夾，Ctrl+Z 復原上次移動。
    </p>
  </body>
</html>

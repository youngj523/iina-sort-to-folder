<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      #buttons {
        position: fixed;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Top and bottom offsets keep the buttons clear of IINA's title bar and
         playback controls. */
      #buttons[data-position$="-left"] {
        left: 16px;
      }
      #buttons[data-position$="-right"] {
        right: 16px;
      }
      #buttons[data-position^="top-"] {
        top: 56px;
      }
      #buttons[data-position^="middle-"] {
        top: 50%;
        transform: translateY(-50%);
      }
      #buttons[data-position^="bottom-"] {
        bottom: 96px;
      }

      button {
        min-width: 112px;
        max-width: 220px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 10px;
        background: rgba(20, 20, 20, 0.5);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0.7;
        cursor: pointer;
        transition: opacity 0.15s, background 0.15s, transform 0.08s;
      }

      button:hover {
        opacity: 1;
        background: rgba(20, 20, 20, 0.78);
      }

      button:active {
        transform: scale(0.96);
      }

      #buttons.compact {
        gap: 5px;
      }
      #buttons.compact button {
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 7px;
      }

      button.unset {
        font-weight: 400;
        opacity: 0.45;
        border-style: dashed;
      }
    </style>
  </head>
  <body>
    <!-- The buttons are created by the script, one per folder. IINA only
         passes clicks to the element that carries data-clickable itself, so a
         button must not contain child elements. -->
    <div id="buttons" data-position="middle-right"></div>

    <script>
      // With more buttons than this, use the smaller style so they fit the window.
      const COMPACT_ABOVE = 5;
      const container = document.getElementById("buttons");

      function applyConfig(raw) {
        let config;
        try {
          config = JSON.parse(decodeURIComponent(raw));
        } catch (err) {
          return;
        }
        if (config.position) {
          container.dataset.position = config.position;
        }
        const slots = config.slots || [];
        container.classList.toggle("compact", slots.length > COMPACT_ABOVE);
        // Rebuild only when the set of folders changes, so a refresh does not
        // replace a button while it is being clicked.
        const wanted = slots.map((item) => item.slot).join(",");
        if (container.dataset.slots !== wanted) {
          container.textContent = "";
          slots.forEach((item) => container.appendChild(createButton(item.slot)));
          container.dataset.slots = wanted;
        }
        slots.forEach((item) => {
          const button = document.getElementById("btn" + item.slot);
          button.classList.toggle("unset", !item.configured);
          button.textContent = item.configured
            ? "→ " + item.label
            : "Folder " + item.slot + " not set";
          button.title = item.configured ? "Move to " + item.label : "";
        });
      }

      function createButton(slot) {
        const button = document.createElement("button");
        button.id = "btn" + slot;
        button.dataset.clickable = "";
        button.addEventListener("click", () => {
          iina.postMessage("move", slot);
          button.blur();
        });
        return button;
      }

      iina.onMessage("config", applyConfig);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      #buttons {
        position: fixed;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Top and bottom offsets keep the buttons clear of IINA's title bar and
         playback controls. */
      #buttons[data-position$="-left"] {
        left: 16px;
      }
      #buttons[data-position$="-right"] {
        right: 16px;
      }
      #buttons[data-position^="top-"] {
        top: 56px;
      }
      #buttons[data-position^="middle-"] {
        top: 50%;
        transform: translateY(-50%);
      }
      #buttons[data-position^="bottom-"] {
        bottom: 96px;
      }

      button {
        min-width: 112px;
        max-width: 220px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 10px;
        background: rgba(20, 20, 20, 0.5);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0.7;
        cursor: pointer;
        transition: opacity 0.15s, background 0.15s, transform 0.08s;
      }

      button:hover {
        opacity: 1;
        background: rgba(20, 20, 20, 0.78);
      }

      button:active {
        transform: scale(0.96);
      }

      button.unset {
        font-weight: 400;
        opacity: 0.45;
        border-style: dashed;
      }
    </style>
  </head>
  <body>
    <!-- IINA only passes clicks to the element that carries data-clickable
         itself, so the buttons must not contain child elements. -->
    <div id="buttons" data-position="middle-right">
      <button id="btn1" data-clickable data-slot="1"></button>
      <button id="btn2" data-clickable data-slot="2"></button>
    </div>

    <script>
      function applyConfig(raw) {
        let config;
        try {
          config = JSON.parse(decodeURIComponent(raw));
        } catch (err) {
          return;
        }
        if (config.position) {
          document.getElementById("buttons").dataset.position = config.position;
        }
        (config.slots || []).forEach((item) => {
          const button = document.getElementById("btn" + item.slot);
          if (!button) return;
          button.classList.toggle("unset", !item.configured);
          button.textContent = item.configured
            ? "→ " + item.label
            : "Folder " + item.slot + " not set";
          button.title = item.configured ? "Move to " + item.label : "";
        });
      }

      document.querySelectorAll("button[data-slot]").forEach((button) => {
        button.addEventListener("click", () => {
          iina.postMessage("move", Number(button.dataset.slot));
          button.blur();
        });
      });

      iina.onMessage("config", applyConfig);
    </script>
  </body>
</html>
